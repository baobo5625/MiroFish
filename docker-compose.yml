services:
  mirofish:
    image: ghcr.io/666ghj/mirofish:latest
    # 加速镜像（如拉取缓慢可替换上方地址）
    # image: ghcr.nju.edu.cn/666ghj/mirofish:latest
    container_name: mirofish
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      - neo4j

  # Graphiti 的时序知识图谱后端（替代 Zep Cloud）
  neo4j:
    image: neo4j:5.26
    container_name: mirofish-neo4j
    environment:
      - NEO4J_AUTH=neo4j/mirofish
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_max__size=1G
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  neo4j_data: