[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish - 简洁通用的群体智能引擎，预测万物"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM 相关
    "openai>=1.0.0",

    # Graphiti 时序知识图谱（Zep 官方开源核心，替代 Zep Cloud）
    # 后端为 Neo4j 服务器 5.26+；graphiti-core 的 Python 驱动依赖 neo4j 6.x。
    # camel-oasis==0.2.5 错误地把 neo4j 钉成 ==5.23.0（实际 camel-ai 只需
    # neo4j>=5.18），用 [tool.uv] override 放宽到 6.x 以共存。
    "graphiti-core>=0.29",
    "neo4j>=5.26",
    "httpx>=0.27.0",

    # OASIS 社交媒体模拟
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    
    # 文件处理
    "PyMuPDF>=1.24.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# camel-oasis==0.2.5 把 neo4j 硬钉为 ==5.23.0（camel-ai 打包 bug），但
# graphiti-core 需要 neo4j 6.x 驱动。camel-ai 实际只用 neo4j 的 Query/
# ClientError/CypherSyntaxError，在 neo4j 6.x 仍存在，故 override 放宽。
override-dependencies = [
    "neo4j>=6.0.0",
]
